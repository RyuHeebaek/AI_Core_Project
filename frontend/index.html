<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>하이브리드 식단 플래너 Agent</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>🥗 하이브리드 식단 플래너</h1>
      <span class="subtitle">영양성분 선형 조합 · 가성비 역산 · LangGraph 멀티 Agent</span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="chat">대화 &amp; 실행 과정</button>
      <button class="tab-btn" data-tab="plans">식단 계획 관리</button>
      <button class="tab-btn" data-tab="logs">실행 로그 &amp; 이상 탐지</button>
    </nav>
    <div class="api-bar" id="apiStatusBar">API 상태 확인 중...</div>
  </header>

  <main class="container">
    <!-- 1. 대화 화면 -->
    <section id="tab-chat" class="tab-panel active">
      <div class="grid-chat">
        <!-- 좌측: 프로필 & 목표 역산 -->
        <aside class="card">
          <h2>프로필 &amp; 목표 역산</h2>
          <div class="field-row">
            <label>세션 ID</label>
            <input id="sessionIdInput" type="text" value="demo-session-1" />
          </div>
          <div class="two-col">
            <div class="field-row">
              <label>성별</label>
              <select id="profGender">
                <option value="male">남성</option>
                <option value="female">여성</option>
              </select>
            </div>
            <div class="field-row">
              <label>목표</label>
              <select id="profGoal">
                <option value="diet">감량(diet)</option>
                <option value="maintain">유지(maintain)</option>
                <option value="bulk">증량(bulk)</option>
              </select>
            </div>
          </div>
          <div class="two-col">
            <div class="field-row">
              <label>현재 체중(kg)</label>
              <input id="profWeight" type="number" step="0.5" value="75" />
            </div>
            <div class="field-row">
              <label>목표 체중(kg)</label>
              <input id="profTargetWeight" type="number" step="0.5" value="70" />
            </div>
          </div>
          <div class="two-col">
            <div class="field-row">
              <label>목표 기간(주)</label>
              <input id="profWeeks" type="number" min="1" value="4" />
            </div>
            <div class="field-row">
              <label>하루 끼니</label>
              <input id="profMeals" type="number" min="1" max="6" value="3" />
            </div>
          </div>
          <div class="checks">
            <label><input type="checkbox" id="chkLactose" /> 유당불내증</label>
            <label><input type="checkbox" id="chkLowSugar" /> 저당(≤10g)</label>
            <label><input type="checkbox" id="chkNoCaff" /> 18시 이후 무카페인</label>
          </div>
          <button id="saveProfileBtn" class="btn secondary">프로필 저장 &amp; 역산 확인</button>
          <div id="profileResult" class="muted-box"></div>
        </aside>

        <!-- 중앙: 대화 창 -->
        <div class="card chat-card">
          <div class="quick-prompts">
            <button class="chip" data-prompt="강남역 근처 편의점에서 8000원 이하 고단백 한끼 추천해줘">모드B: 강남역 8천원</button>
            <button class="chip" data-prompt="4주 하루 2끼 15만원 이하 온라인 대량 식단 장바구니 추천해줘">모드A: 4주 대량 장바구니</button>
            <button class="chip" data-prompt="남성 체중 75kg인데 어제 치팅으로 1200kcal 초과했어 3일 복구 식단 짜줘">모드C: 치팅 복구</button>
            <button class="chip" data-prompt="감동란 빼고 다른 걸로 바꿔줘">1:1 품목 스왑</button>
          </div>
          <div id="chatErrorBanner" class="alert hidden"></div>
          <div id="chatMessages" class="chat-messages"></div>
          <div id="savePlanBox" class="save-plan-bar hidden">
            <input id="planTitleInput" type="text" placeholder="계획 제목 (예: 강남역 점심 고단백)" />
            <input id="planDateInput" type="date" />
            <input id="planStartInput" type="time" value="12:00" />
            <input id="planEndInput" type="time" value="13:00" />
            <button id="savePlanBtn" class="btn primary">이 식단 계획 저장</button>
          </div>
          <div id="planOverlapNotice" class="alert warn hidden"></div>
          <form id="chatForm" class="chat-input-row">
            <input id="chatInput" type="text" placeholder="식단 조건을 입력하세요 (예: 저녁 7시 유당불내증 제외 8000원 이하)" required />
            <button type="submit" id="sendBtn" class="btn primary">전송</button>
          </form>
        </div>

        <!-- 우측: 실행 타임라인 (F3019) -->
        <aside class="card">
          <div class="panel-head">
            <h2>실행 과정 타임라인</h2>
            <span id="runMetaBadge" class="badge">대기</span>
          </div>
          <div id="timelineBox" class="timeline-box">
            <p class="muted">대화를 실행하면 분석 → 계획 → Tool 호출 → 검증/재계획 → 응답 단계가 순서대로 표시됩니다.</p>
          </div>
          <div id="anomalyInlineBox" class="muted-box"></div>
        </aside>
      </div>
    </section>

    <!-- 2. 식단 계획 관리 (F3015, F3016) -->
    <section id="tab-plans" class="tab-panel">
      <div class="card">
        <div class="panel-head">
          <h2>저장된 식단 계획 목록</h2>
          <button id="refreshPlansBtn" class="btn secondary">새로고침</button>
        </div>
        <div id="plansAlert" class="alert warn hidden"></div>
        <div id="plansList" class="list-stack"></div>
      </div>
    </section>

    <!-- 3. 실행 로그 & 이상 탐지 (F3014, F3020) -->
    <section id="tab-logs" class="tab-panel">
      <div class="grid-logs">
        <div class="card">
          <div class="panel-head">
            <h2>세션별 실행 로그</h2>
            <button id="refreshLogsBtn" class="btn secondary">새로고침</button>
          </div>
          <div id="logsAlert" class="alert hidden"></div>
          <div id="logSessionsList" class="list-stack"></div>
        </div>
        <div class="card">
          <div class="panel-head">
            <h2>실행 로그 상세 &amp; 이상 징후 진단</h2>
            <div class="btn-group">
              <button id="analyzeLogBtn" class="btn primary" disabled>이상 징후 판정(F3020)</button>
              <button id="deleteLogBtn" class="btn danger" disabled>세션 로그 삭제</button>
            </div>
          </div>
          <div id="anomalyDetailBox" class="muted-box hidden"></div>
          <div id="logEventsList" class="timeline-box">
            <p class="muted">좌측에서 세션을 선택하면 발생 순서대로 로그가 표시됩니다. (실행 로그는 수정할 수 없습니다)</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
